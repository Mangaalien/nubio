name: auto-update

on:
  schedule:
    # Daily at 04:17 UTC
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: nubio
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream NuvioTV main
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioTV
          git fetch upstream main
          git merge upstream/main --no-edit
        # Merge conflicts fail the job loudly (non-zero exit).

      - name: Push merge commit
        run: git push origin nubio

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read version from build config
        id: version
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.NUVIO_RELEASE_KEYSTORE_B64 }}" | base64 -d > nuviotv.jks
          echo "NUVIO_RELEASE_STORE_FILE=$(pwd)/nuviotv.jks" >> "$GITHUB_ENV"

      - name: Build APK (full debug, signed)
        env:
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleFullDebug

      - name: Upload APK to draft release for review
        run: |
          # Release policy: builds land as DRAFT. Owner verifies install + seeds,
          # then publishes the release and bumps minVersionCode in min_version.json.
          gh release delete --repo Mangaalien/nubio "v${{ steps.version.outputs.name }}" --yes || true
          gh release create --repo Mangaalien/nubio "v${{ steps.version.outputs.name }}" \
            --title "Nubio v${{ steps.version.outputs.name }}" \
            --notes "Automated build of upstream NuvioTV main (merged $(date -u +%Y-%m-%d)). Draft — review before publishing." \
            --draft \
            app/build/outputs/apk/full/debug/*.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
