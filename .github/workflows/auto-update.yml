name: auto-update

on:
  schedule:
    # Daily at 04:17 UTC
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: nubio
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream NuvioTV main
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioTV
          git fetch upstream main
          git merge upstream/main --no-edit
        # Merge conflicts fail the job loudly (non-zero exit).

      - name: Push merge commit
        run: git push origin nubio

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read version from build config
        id: version
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Build APK (full debug)
        run: ./gradlew --no-daemon :app:assembleFullDebug

      - name: Delete existing release if tag exists
        run: |
          gh release delete "v${{ steps.version.outputs.name }}" --yes || true
          git push origin :refs/tags/v${{ steps.version.outputs.name }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            --title "Nubio v${{ steps.version.outputs.name }}" \
            --notes "Automated build of upstream NuvioTV main (merged $(date -u +%Y-%m-%d))." \
            app/build/outputs/apk/full/debug/*.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
